<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications | LostLink</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body data-root="../../">
  <div id="navbar"></div>

  <main class="container py-4" style="max-width: 900px;">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="h3 mb-0">Notifications</h1>
        <p class="small text-muted mb-0">Match alerts, claim updates, and campus announcements.</p>
      </div>
      <button type="button" class="btn btn-outline-primary btn-sm d-none" id="mark-all-btn">
        <i class="bi bi-check2-all"></i> Mark All as Read
      </button>
    </div>

    <div id="message"></div>

    <div class="card shadow-sm mb-4 d-none" id="admin-announce-card">
      <div class="card-body p-4">
        <div class="ll-eyebrow">Admin Broadcast</div>
        <h2 class="h5 mb-3">Send Announcement</h2>
        <form id="announce-form" novalidate>
          <div class="mb-3">
            <label for="ann-title" class="form-label">Title *</label>
            <input type="text" class="form-control" id="ann-title" maxlength="100"
              placeholder="e.g. Security Office Operating Hours">
            <div class="invalid-feedback" id="ann-title-error"></div>
          </div>
          <div class="mb-3">
            <label for="ann-message" class="form-label">Message *</label>
            <textarea class="form-control" id="ann-message" rows="3" maxlength="500"
              placeholder="Write the announcement for all students..."></textarea>
            <div class="invalid-feedback" id="ann-message-error"></div>
          </div>
          <button type="submit" class="btn btn-primary" id="ann-btn">
            <i class="bi bi-megaphone"></i> Send Announcement
          </button>
        </form>
      </div>
    </div>

    <div class="ll-tabs mb-3" id="filter-tabs">
      <button type="button" class="ll-tab active" data-filter="all">All <span id="tab-all">0</span></button>
      <button type="button" class="ll-tab" data-filter="unread">Unread <span id="tab-unread">0</span></button>
      <button type="button" class="ll-tab" data-filter="Match">Matches <span id="tab-Match">0</span></button>
      <button type="button" class="ll-tab" data-filter="Claim">Claims <span id="tab-Claim">0</span></button>
      <button type="button" class="ll-tab" data-filter="Announcement">Announcements <span id="tab-Announcement">0</span></button>
    </div>

    <div id="notif-list"></div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../../assets/js/supabase.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="notifications.js"></script>
</body>
</html>
