<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users | LostLink</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body data-root="../../">
  <div id="navbar"></div>

  <!-- A1 User / Account - RETRIEVE (admin list + search) and DELETE (deactivate) -->
  <main class="container py-4">
    <h1 class="h3 mb-3">Manage Users</h1>
    <div id="message"></div>

    <form id="search-form" class="row g-2 mb-3" novalidate>
      <div class="col-md-6">
        <input type="text" class="form-control" id="search" placeholder="Search by name, student ID or email">
        <div class="invalid-feedback" id="search-error"></div>
      </div>
      <div class="col-md-3">
        <select class="form-select" id="status-filter">
          <option value="">All statuses</option>
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>
      </div>
      <div class="col-md-3 d-flex gap-2">
        <button type="submit" class="btn btn-primary flex-fill">Search</button>
        <button type="button" class="btn btn-outline-secondary flex-fill" id="reset-btn">Show All</button>
      </div>
    </form>

    <div class="table-responsive">
      <table class="table table-hover bg-white shadow-sm align-middle">
        <thead class="table-light">
          <tr>
            <th>ID</th><th>Name</th><th>Student ID</th><th>Email</th><th>Phone</th>
            <th>Role</th><th>Status</th><th>Joined</th><th>Action</th>
          </tr>
        </thead>
        <tbody id="user-table"></tbody>
      </table>
    </div>
    <p class="text-muted small" id="count"></p>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../../assets/js/supabase.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="admin-users.js"></script>
</body>
</html>
