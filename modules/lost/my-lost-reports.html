<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Lost Reports | LostLink</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body data-root="../../">
  <div id="navbar"></div>

  <main class="container py-4">
    <div class="ll-profile-head mb-3">
      <div class="ll-avatar-lg" id="head-avatar"></div>
      <div class="flex-fill">
        <h1 class="h4 mb-1">
          <span id="head-name">My Lost Reports</span>
          <span class="ll-chip ll-chip-blue" id="head-role"></span>
        </h1>
        <div class="small text-muted" id="head-info"></div>
      </div>
      <a href="lost-form.html" class="btn btn-primary btn-sm">
        <i class="bi bi-plus-lg"></i> Report Lost Item
      </a>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-4">
        <div class="ll-stat">
          <div class="ll-stat-label">Still Lost</div>
          <div class="ll-stat-value text-amber" id="stat-lost">0</div>
        </div>
      </div>
      <div class="col-4">
        <div class="ll-stat">
          <div class="ll-stat-label">Marked Found</div>
          <div class="ll-stat-value text-emerald" id="stat-found">0</div>
        </div>
      </div>
      <div class="col-4">
        <div class="ll-stat">
          <div class="ll-stat-label">Total Reports</div>
          <div class="ll-stat-value" id="stat-total">0</div>
        </div>
      </div>
    </div>

    <div id="message"></div>

    <div class="ll-tabs mb-3" id="status-tabs">
      <button type="button" class="ll-tab active" data-status="">All <span id="tab-all">0</span></button>
      <button type="button" class="ll-tab" data-status="Lost">Lost <span id="tab-lost">0</span></button>
      <button type="button" class="ll-tab" data-status="Found">Found <span id="tab-found">0</span></button>
    </div>

    <div class="card shadow-sm mb-3">
      <div class="card-body py-3">
        <div class="row g-2 align-items-center">
          <div class="col-md-3">
            <input type="text" class="form-control form-control-sm" id="filter-search" placeholder="Search item name...">
          </div>
          <div class="col-md-3">
            <select class="form-select form-select-sm" id="filter-category">
              <option value="">All Categories</option>
            </select>
          </div>
          <div class="col-md-3">
            <select class="form-select form-select-sm" id="filter-location">
              <option value="">All Locations</option>
            </select>
          </div>
          <div class="col-md-2">
            <input type="date" class="form-control form-control-sm" id="filter-date" title="Filter by date lost">
          </div>
          <div class="col-md-1">
            <button type="button" class="btn btn-outline-secondary btn-sm w-100" id="reset-btn">Reset</button>
          </div>
        </div>
      </div>
    </div>

    <div id="report-list"></div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../../assets/js/supabase.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="my-lost-reports.js"></script>
</body>
</html>
