<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categories &amp; Locations - LostLink</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
  <style>
    #map {
      height: 280px;
      width: 100%;
      border-radius: 0.375rem;
    }
  </style>
</head>
<body data-root="../../">
  <div id="navbar"></div>

  <main class="container my-4">
    <h1 class="page-title h3 mb-4">Categories &amp; locations</h1>
    <div id="message"></div>
    <div class="row g-4">

      <!-- CATEGORIES -->
      <section class="col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5">Categories</h2>
            <form id="catForm" class="row g-2 mb-3" novalidate>
              <input type="hidden" id="catId">
              <div class="col-12 col-md-4">
                <input id="catName" class="form-control" placeholder="Name (e.g. Electronics)" maxlength="50">
              </div>
              <div class="col-12 col-md-5">
                <input id="catDesc" class="form-control" placeholder="Description (optional)" maxlength="200">
              </div>
              <div class="col-12 col-md-3 d-flex gap-1">
                <button type="submit" class="btn btn-primary flex-fill" id="catSave">Add category</button>
                <button type="button" class="btn btn-outline-secondary d-none" id="catCancel">Cancel</button>
              </div>
            </form>
            <table class="table table-sm align-middle">
              <thead>
                <tr><th>Name</th><th>Description</th><th></th></tr>
              </thead>
              <tbody id="catBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- LOCATIONS -->
      <section class="col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5">Campus locations</h2>
            <div id="map" class="mb-2"></div>
            <p class="small text-muted mb-2">Click the map to fill in the pin, then save.</p>
            <form id="locForm" class="row g-2 mb-3" novalidate>
              <input type="hidden" id="locId">
              <div class="col-12 col-md-4">
                <input id="locName" class="form-control" placeholder="Name (e.g. Block A)" maxlength="50">
              </div>
              <div class="col-6 col-md-2">
                <input id="locLat" class="form-control" placeholder="Latitude">
              </div>
              <div class="col-6 col-md-2">
                <input id="locLng" class="form-control" placeholder="Longitude">
              </div>
              <div class="col-12 col-md-4 d-flex gap-1">
                <button type="submit" class="btn btn-primary flex-fill" id="locSave">Add location</button>
                <button type="button" class="btn btn-outline-secondary d-none" id="locCancel">Cancel</button>
              </div>
            </form>
            <table class="table table-sm align-middle">
              <thead>
                <tr><th>Name</th><th>Pin</th><th></th></tr>
              </thead>
              <tbody id="locBody"></tbody>
            </table>
          </div>
        </div>
      </section>

    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../../assets/js/supabase.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="location.js"></script>
</body>
</html>
