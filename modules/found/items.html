<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Found Items - LostLink</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
  <style>
    .item-card img {
      height: 190px;
      object-fit: cover;
      width: 100%;
    }
    .no-photo {
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body data-root="../../">
  <div id="navbar"></div>

  <main class="container my-4">
    <div id="alertBox"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="page-title h3 mb-0">Found items</h1>
      <button id="addBtn" type="button" class="btn btn-primary d-none" data-bs-toggle="modal" data-bs-target="#itemModal" onclick="openAdd()">Add found item</button>
    </div>

    <div class="row g-2 mb-4">
      <div class="col-md-4"><input id="fSearch" class="form-control" placeholder="Search by name or description"></div>
      <div class="col-md-3"><select id="fCategory" class="form-select"><option value="">All categories</option></select></div>
      <div class="col-md-3"><select id="fLocation" class="form-select"><option value="">All locations</option></select></div>
      <div class="col-md-2">
        <select id="fStatus" class="form-select">
          <option value="">Any status</option>
          <option>Available</option>
          <option>Claimed</option>
          <option>Returned</option>
        </select>
      </div>
    </div>

    <div id="items" class="row g-3"></div>
  </main>

  <!-- Add modal (students and admin) / Edit modal (admin only) -->
  <div class="modal fade" id="itemModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form id="itemForm" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="modalTitle">Add found item</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body row g-3">
            <div class="col-12" id="formMsg"></div>
            <input type="hidden" id="itemId">
            <div class="col-md-6">
              <label class="form-label">Item name *</label>
              <input id="itemName" class="form-control" maxlength="100">
            </div>
            <div class="col-md-3">
              <label class="form-label">Category *</label>
              <select id="itemCategory" class="form-select"></select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Location found *</label>
              <select id="itemLocation" class="form-select"></select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Date found *</label>
              <input id="itemDate" type="date" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">Storage place *</label>
              <input id="itemStorage" class="form-control" placeholder="e.g. Security office" maxlength="100">
            </div>
            <div class="col-md-4" id="statusGroup">
              <label class="form-label">Status</label>
              <select id="itemStatus" class="form-select">
                <option>Available</option>
                <option>Claimed</option>
                <option>Returned</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Description (public) *</label>
              <textarea id="itemDesc" class="form-control" rows="2" maxlength="500"></textarea>
            </div>
            <div class="col-12">
              <label class="form-label">Hidden detail (only the admin sees it; used to check claims) *</label>
              <input id="itemHidden" class="form-control" placeholder="e.g. wallpaper is a cat, scratch on the back" maxlength="200">
            </div>
            <div class="col-12">
              <label class="form-label">Photo (JPG/PNG, max 2 MB)</label>
              <input id="itemPhoto" type="file" class="form-control" accept="image/jpeg,image/png">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="itemSave">Save item</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../../assets/js/supabase.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="found.js"></script>
</body>
</html>
