<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Claims | LostLink</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body data-root="../../">
  <div id="navbar"></div>

  <!-- A2 Claim Verification - RETRIEVE (admin: all claims, filter by status) -->
  <main class="container py-4">
    <h1 class="h3 mb-3">Manage Claims</h1>
    <div id="message"></div>

    <!-- Status filter tabs -->
    <ul class="nav nav-pills mb-3" id="status-tabs">
      <li class="nav-item"><button class="nav-link active" data-status="Pending">Pending <span class="badge bg-light text-dark" id="count-Pending">0</span></button></li>
      <li class="nav-item"><button class="nav-link" data-status="Approved">Approved <span class="badge bg-light text-dark" id="count-Approved">0</span></button></li>
      <li class="nav-item"><button class="nav-link" data-status="Rejected">Rejected <span class="badge bg-light text-dark" id="count-Rejected">0</span></button></li>
      <li class="nav-item"><button class="nav-link" data-status="">All</button></li>
    </ul>

    <div class="table-responsive">
      <table class="table table-hover bg-white shadow-sm align-middle">
        <thead class="table-light">
          <tr>
            <th>Claim ID</th><th>Item</th><th>Item Status</th><th>Claimant</th>
            <th>Submitted</th><th>Claim Status</th><th>Action</th>
          </tr>
        </thead>
        <tbody id="claim-table"></tbody>
      </table>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../../assets/js/supabase.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="admin-claims.js"></script>
</body>
</html>
