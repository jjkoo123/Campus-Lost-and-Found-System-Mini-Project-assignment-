<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claim Item | Campus Lost & Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body data-root="../../">
  <div id="navbar"></div>

  <!-- A2 Claim Verification - CREATE (new claim) and UPDATE (edit pending claim)
       New claim:  claim-form.html?item=FOUND_ITEM_ID   (link from Found Item detail page)
       Edit claim: claim-form.html?id=CLAIM_ID          (link from My Claims) -->
  <main class="container py-4" style="max-width: 760px;">
    <h1 class="h3 mb-3" id="page-title">Claim a Found Item</h1>
    <div id="message"></div>

    <form id="claim-form" novalidate>
      <!-- Shown only when no item was passed in the URL -->
      <div class="mb-3 d-none" id="item-select-group">
        <label for="item-select" class="form-label">Found Item *</label>
        <select class="form-select" id="item-select">
          <option value="">-- Select an available item --</option>
        </select>
        <div class="invalid-feedback" id="item-select-error"></div>
      </div>

      <!-- Item summary (public info only, hidden detail is NOT shown) -->
      <div class="card mb-3 d-none" id="item-card">
        <div class="row g-0">
          <div class="col-md-4">
            <img id="item-photo" class="img-fluid rounded-start d-none" alt="Item photo">
          </div>
          <div class="col-md-8">
            <div class="card-body">
              <h2 class="h5 card-title" id="item-name"></h2>
              <p class="mb-1 small text-muted" id="item-meta"></p>
              <p class="mb-1" id="item-description"></p>
              <div id="item-status"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="alert alert-info small">
        Prove the item is yours. Describe something only the owner would know
        (what is inside, a scratch, a sticker, a name written on it...).
        The admin will compare your answer with the item's hidden detail.
      </div>

      <div class="mb-3">
        <label for="proof-description" class="form-label">Proof Description *</label>
        <textarea class="form-control" id="proof-description" rows="4" maxlength="500"
          placeholder="e.g. Black leather wallet with my IC, a Touch 'n Go card and RM20 inside"></textarea>
        <div class="form-text"><span id="proof-count">0</span>/500 characters (min 10)</div>
        <div class="invalid-feedback" id="proof-description-error"></div>
      </div>

      <div class="mb-3">
        <label for="special-mark" class="form-label">Special Mark *</label>
        <input type="text" class="form-control" id="special-mark" maxlength="200"
          placeholder="e.g. Small Doraemon sticker on the back">
        <div class="invalid-feedback" id="special-mark-error"></div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary" id="submit-btn">Submit Claim</button>
        <a href="my-claims.html" class="btn btn-outline-secondary">Back to My Claims</a>
      </div>
    </form>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../../assets/js/supabase.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="claim-form.js"></script>
</body>
</html>
