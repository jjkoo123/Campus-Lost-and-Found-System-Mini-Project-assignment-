<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Claims | LostLink</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body data-root="../../">
  <div id="navbar"></div>

  <!-- A2 Claim Verification - RETRIEVE (own claims) and DELETE (cancel pending claim) -->
  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0">My Claims</h1>
      <a href="claim-form.html" class="btn btn-primary">+ New Claim</a>
    </div>
    <div id="message"></div>

    <div class="table-responsive">
      <table class="table table-hover bg-white shadow-sm align-middle">
        <thead class="table-light">
          <tr>
            <th>Claim ID</th><th>Item</th><th>My Proof</th><th>Submitted</th>
            <th>Status</th><th>Admin Remark</th><th>Action</th>
          </tr>
        </thead>
        <tbody id="claim-table"></tbody>
      </table>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../../assets/js/supabase.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="my-claims.js"></script>
</body>
</html>
