<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Claim | Campus Lost & Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body data-root="../../">
  <div id="navbar"></div>

  <!-- A2 Claim Verification - UPDATE (approve / reject)
       ⭐ UNIQUE FEATURE: Claim Proof Check
       Admin sees the item's HIDDEN DETAIL beside the claimant's PROOF. -->
  <main class="container py-4">
    <a href="admin-claims.html" class="btn btn-link px-0 mb-2">&larr; Back to all claims</a>
    <h1 class="h3 mb-1">Claim Proof Check <span id="claim-no" class="text-muted"></span></h1>
    <p class="mb-3" id="claim-status"></p>
    <div id="message"></div>

    <div class="row g-3 mb-3">
      <!-- LEFT: what the admin knows (secret) -->
      <div class="col-md-6">
        <div class="card h-100 border-primary">
          <div class="card-header bg-primary text-white">🔒 Found Item (admin only)</div>
          <div class="card-body">
            <img id="item-photo" class="img-fluid rounded mb-2 d-none" style="max-height: 180px;" alt="Item photo">
            <h2 class="h5" id="item-name"></h2>
            <p class="small text-muted mb-2" id="item-meta"></p>
            <p class="mb-2"><b>Public description:</b> <span id="item-description"></span></p>
            <p class="mb-1"><b>Hidden detail:</b></p>
            <div class="compare-box bg-warning-subtle border rounded p-2 mb-2" id="hidden-detail"></div>
            <p class="mb-0 small"><b>Storage place:</b> <span id="storage-place"></span></p>
          </div>
        </div>
      </div>

      <!-- RIGHT: what the claimant says -->
      <div class="col-md-6">
        <div class="card h-100 border-success">
          <div class="card-header bg-success text-white">🙋 Claimant's Proof</div>
          <div class="card-body">
            <p class="mb-2"><b id="claimant-name"></b><br>
              <span class="small text-muted" id="claimant-info"></span></p>
            <p class="mb-1"><b>Proof description:</b></p>
            <div class="compare-box bg-success-subtle border rounded p-2 mb-2" id="proof-description"></div>
            <p class="mb-1"><b>Special mark:</b></p>
            <div class="compare-box bg-success-subtle border rounded p-2" style="min-height: 40px;" id="special-mark"></div>
            <p class="small text-muted mt-2 mb-0" id="claim-date"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- Keyword match helper -->
    <div class="alert alert-secondary small" id="match-hint"></div>

    <!-- Other claims on the same item -->
    <div class="alert alert-warning small d-none" id="other-claims"></div>

    <!-- Decision -->
    <div class="card shadow-sm" id="decision-card">
      <div class="card-body">
        <h2 class="h5">Decision</h2>
        <form id="decision-form" novalidate>
          <div class="mb-3">
            <label for="remark" class="form-label">Admin Remark <span class="text-muted small">(required when rejecting)</span></label>
            <textarea class="form-control" id="remark" rows="2" maxlength="300"
              placeholder="e.g. Proof matches. Please collect at Security Office with your student card."></textarea>
            <div class="invalid-feedback" id="remark-error"></div>
          </div>
          <button type="button" class="btn btn-success me-2" id="approve-btn">✔ Approve</button>
          <button type="button" class="btn btn-danger" id="reject-btn">✖ Reject</button>
        </form>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../../assets/js/supabase.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="review.js"></script>
</body>
</html>
