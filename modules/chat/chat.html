<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat | LostLink</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
  <style>
    #message-list { height: 420px; overflow-y: auto; background: #f8f9ff; }
    .bubble { max-width: 75%; white-space: pre-wrap; word-wrap: break-word; }
    .conv-item.active { background: #e5eeff; color: #0b1c30; border-color: var(--bs-list-group-border-color); }
  </style>
</head>
<body data-root="../../">
  <div id="navbar"></div>

  <!-- Chat module: live chat between each student and the admin (security office)
       CREATE send message | RETRIEVE view chat | UPDATE edit own message | DELETE delete own message -->
  <main class="container py-4">
    <h1 class="h3 mb-3">Chat</h1>
    <div id="message"></div>

    <div class="row g-3">
      <!-- Admin only: list of student conversations -->
      <div class="col-md-4 d-none" id="conv-panel">
        <div class="card shadow-sm">
          <div class="card-header fw-semibold">Students</div>
          <div class="p-2 border-bottom">
            <input type="text" class="form-control form-control-sm" id="conv-search" placeholder="Search name or student ID">
          </div>
          <div class="list-group list-group-flush" id="conv-list" style="max-height: 460px; overflow-y: auto;"></div>
        </div>
      </div>

      <!-- Conversation -->
      <div class="col" id="chat-panel">
        <div class="card shadow-sm">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span class="fw-semibold" id="chat-title">Chat with Security Office</span>
            <span class="badge bg-success" id="live-badge">● Live</span>
          </div>
          <div class="card-body p-3" id="message-list">
            <p class="text-muted text-center mt-5" id="empty-text">Select a conversation.</p>
          </div>
          <div class="card-footer">
            <form id="chat-form" novalidate>
              <div class="d-flex gap-2 align-items-start">
                <div class="flex-fill">
                  <textarea class="form-control" id="chat-input" rows="2" maxlength="500"
                    placeholder="Type a message..."></textarea>
                  <div class="invalid-feedback" id="chat-input-error"></div>
                  <div class="form-text"><span id="char-count">0</span>/500
                    <span id="edit-hint" class="ms-2 text-primary d-none">Editing message ·
                      <a href="#" id="cancel-edit">cancel</a></span>
                  </div>
                </div>
                <button type="submit" class="btn btn-primary" id="send-btn" disabled>Send</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../../assets/js/supabase.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/layout.js"></script>
  <script src="chat.js"></script>
</body>
</html>
