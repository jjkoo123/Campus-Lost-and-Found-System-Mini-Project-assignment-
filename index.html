<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | Campus Lost & Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-root="">
  <div id="navbar"></div>

  <main class="container py-4">
    <!-- Shared home page: team to add search, latest found items, quick stats -->
    <h1 class="h3">Welcome to Campus Lost &amp; Found</h1>
    <p id="welcome" class="text-muted">Lost something on campus? Report it or browse found items.</p>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    (async () => {
      const me = await initLayout(null);   // public page
      if (me) {
        document.getElementById("welcome").textContent = "Hello, " + me.name + "! You are logged in as " + me.role + ".";
      }
    })();
  </script>
</body>
</html>
